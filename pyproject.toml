[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsar-pipeline"
version = "0.2.0"
description = "Pulsar social-listening API extraction for the VaynerX data platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only the local analysis scripts need these; the extractor does not, and
# keeping them out of the runtime keeps a Lambda bundle small.
analysis = [
    "pandas>=2.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pulsar",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
# Live tests cost API calls against a metered vendor, so they never run
# unless asked for explicitly: pytest -m live
markers = [
    "live: hits the real Pulsar API and spends quota (deselected by default)",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RET",       # return consistency
    "PTH",       # prefer pathlib
    "ARG",       # unused arguments
    "DTZ",       # timezone-aware datetimes
    "S",         # bandit security
    "RUF",
]
ignore = [
    "S101",   # assert is fine in tests
    "E501",   # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# The numbered scripts are operator-facing CLIs: printing is the interface,
# and they are run by hand rather than imported.
"0*.py" = ["T201"]
"tests/*" = ["S105", "S106", "ARG001", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
mypy_path = "src:tests"
explicit_package_bases = true
# Deliberately not pinning python_version: mypy then uses the running
# interpreter, which keeps it consistent with the installed third-party
# stubs. CI pins the interpreter itself (3.11, our floor) instead.
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
# The numbered operator scripts are hand-run CLIs, not importable modules,
# and their filenames are not valid Python identifiers.
exclude = []

[[tool.mypy.overrides]]
module = ["pandas.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's bundled stubs use `type` statements (3.12+), which trip mypy when
# it is pinned to our 3.11 floor. Nothing in `pulsar/` imports numpy; it
# arrives transitively via the analysis extras.
module = ["numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
